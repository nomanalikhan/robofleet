# Serves the built UI and forwards /api to the Fleet API, so the browser talks to one origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite hashes asset names, so they can be cached forever. index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://central-api:8000;
    }

    # Client side routes like /robots/rv-1 all load the app.
    location / {
        try_files $uri /index.html;
    }
}
