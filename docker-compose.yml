name: olivaw

# Defaults live in botsim's main.go. Compose only passes overrides through.
x-botsim: &botsim
  image: olivaw/botsim:dev
  restart: unless-stopped
  build: ./simulator/botsim
  environment: &botsim-env
    CHAOS_ERROR_RATE: ${CHAOS_ERROR_RATE:-}
    CHAOS_STUCK_RATE: ${CHAOS_STUCK_RATE:-}
    CHAOS_DROPOUT_RATE: ${CHAOS_DROPOUT_RATE:-}
    CHAOS_DELAY_RATE: ${CHAOS_DELAY_RATE:-}

configs:
  # Central broker topology, loaded at boot. The gateway publishes to the fleet
  # exchange, central ingest consumes central.telemetry, and batches ingest
  # rejects land in central.telemetry.dead for inspection.
  central-rabbitmq-conf:
    content: |
      load_definitions = /etc/rabbitmq/definitions.json
  central-rabbitmq-definitions:
    content: |
      {
        "users": [{"name": "olivaw", "password_hash": "b2xpdlY9CwCFPatk9tpew/XjmFpvmU3VAakdxJ4+jZdNZs3u",
                   "hashing_algorithm": "rabbit_password_hashing_sha256", "tags": ["administrator"]}],
        "vhosts": [{"name": "/"}],
        "permissions": [{"user": "olivaw", "vhost": "/", "configure": ".*", "write": ".*", "read": ".*"}],
        "exchanges": [{"name": "fleet", "vhost": "/", "type": "topic", "durable": true,
                       "auto_delete": false, "internal": false, "arguments": {}}],
        "queues": [{"name": "central.telemetry", "vhost": "/", "durable": true, "auto_delete": false,
                    "arguments": {"x-dead-letter-exchange": "", "x-dead-letter-routing-key": "central.telemetry.dead"}},
                   {"name": "central.telemetry.dead", "vhost": "/", "durable": true,
                    "auto_delete": false, "arguments": {}}],
        "bindings": [{"source": "fleet", "vhost": "/", "destination": "central.telemetry",
                      "destination_type": "queue", "routing_key": "site.*.telemetry", "arguments": {}}]
      }

services:
  # ---------- central ----------
  # Demo credentials olivaw/olivaw. Management UI on http://localhost:15672.
  central-rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    configs:
      - source: central-rabbitmq-conf
        target: /etc/rabbitmq/rabbitmq.conf
      - source: central-rabbitmq-definitions
        target: /etc/rabbitmq/definitions.json
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  central-db:
    image: timescale/timescaledb:2.16.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: olivaw
      POSTGRES_PASSWORD: olivaw
      POSTGRES_DB: fleet
    volumes:
      - central-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "olivaw", "-d", "fleet"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Consumes central.telemetry and stores every reading in TimescaleDB.
  central-ingest:
    image: olivaw/ingest:dev
    build: ./central/ingest
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://olivaw:olivaw@central-rabbitmq:5672/
      DATABASE_URL: postgresql://olivaw:olivaw@central-db:5432/fleet
    depends_on:
      central-db:
        condition: service_healthy
      central-rabbitmq:
        condition: service_healthy

  # Read-only Fleet API. Swagger on http://localhost:8000/docs.
  central-api:
    image: olivaw/api:dev
    build: ./central/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://olivaw:olivaw@central-db:5432/fleet
    ports:
      - "8000:8000"
    depends_on:
      central-db:
        condition: service_healthy
      central-ingest:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The web UI on http://localhost:3000, with /api proxied to central-api.
  central-web:
    image: olivaw/web:dev
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - central-api

  # ---------- site 1 ----------
  # Service names are <site>-<role>, so containers read like
  # olivaw-site1-bot-cleanix-3. The site-1 software is mosquitto and gateway.
  # The site1-bot-* services stand in for the robots.
  site1-mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    volumes:
      - ./site/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The only link between this site's robots and central. Telemetry goes up,
  # commands come down.
  site1-gateway:
    image: olivaw/gateway:dev
    restart: unless-stopped
    build: ./site/gateway
    environment:
      SITE_ID: site-1
      MQTT_HOST: site1-mosquitto
      CLEANIX_DISCOVERY: site1-bot-cleanix:8080
      AMQP_URL: amqp://olivaw:olivaw@central-rabbitmq:5672/
    volumes:
      - site1-gateway-data:/data
    depends_on:
      site1-mosquitto:
        condition: service_healthy

  # Many Rovo robots in one container, one goroutine each.
  site1-bot-rovo:
    <<: *botsim
    environment:
      <<: *botsim-env
      MQTT_URL: tcp://site1-mosquitto:1883
      ROVO_COUNT: ${ROVO_COUNT:-5}
    depends_on:
      site1-mosquitto:
        condition: service_healthy

  # One container per Cleanix robot, so each has its own IP. The service name
  # resolves to every replica. Ports are published only for curl from the host.
  site1-bot-cleanix:
    <<: *botsim
    environment:
      <<: *botsim-env
      CLEANIX_COUNT: 1
    deploy:
      replicas: ${CLEANIX_COUNT:-5}
    ports:
      - "9101-9150:8080"

volumes:
  site1-gateway-data:
  central-db-data:
