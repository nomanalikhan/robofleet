name: olivaw

# Defaults live in botsim's main.go. Compose only passes overrides through.
x-botsim: &botsim
  image: olivaw/botsim:dev
  build: ./simulator/botsim
  environment: &botsim-env
    CHAOS_ERROR_RATE: ${CHAOS_ERROR_RATE:-}
    CHAOS_STUCK_RATE: ${CHAOS_STUCK_RATE:-}
    CHAOS_DROPOUT_RATE: ${CHAOS_DROPOUT_RATE:-}
    CHAOS_DELAY_RATE: ${CHAOS_DELAY_RATE:-}

services:
  # ---------- site 1 ----------
  # Service names are <site>-<role>, so containers read like
  # olivaw-site1-bot-cleanix-3. The site-1 software is mosquitto and gateway.
  # The site1-bot-* services stand in for the robots.
  site1-mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./site/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The only link between this site's robots and central. Telemetry goes up,
  # commands come down.
  site1-gateway:
    image: olivaw/gateway:dev
    build: ./site/gateway
    environment:
      SITE_ID: site-1
      MQTT_HOST: site1-mosquitto
      CLEANIX_DISCOVERY: site1-bot-cleanix:8080
    volumes:
      - site1-gateway-data:/data
    depends_on:
      site1-mosquitto:
        condition: service_healthy

  # Many Rovo robots in one container, one goroutine each.
  site1-bot-rovo:
    <<: *botsim
    environment:
      <<: *botsim-env
      MQTT_URL: tcp://site1-mosquitto:1883
      ROVO_COUNT: ${ROVO_COUNT:-5}
    depends_on:
      site1-mosquitto:
        condition: service_healthy

  # One container per Cleanix robot, so each has its own IP. The service name
  # resolves to every replica. Ports are published only for curl from the host.
  site1-bot-cleanix:
    <<: *botsim
    environment:
      <<: *botsim-env
      CLEANIX_COUNT: 1
    deploy:
      replicas: ${CLEANIX_COUNT:-5}
    ports:
      - "9101-9150:8080"

volumes:
  site1-gateway-data:
